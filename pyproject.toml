[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhb"
version = "0.1.0"
description = "pyHB harmonic-balance tools for nonlinear dynamic response analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "pyHB contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.7",
]
autodiff = [
    "torch>=2.0",
]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/shuizidesu/pyhb"
Repository = "https://github.com/shuizidesu/pyhb"
Issues = "https://github.com/shuizidesu/pyhb/issues"

[tool.setuptools.packages.find]
include = ["pyhb*"]

[tool.setuptools.package-data]
pyhb = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples/*/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
