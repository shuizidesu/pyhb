[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhb"
version = "0.1.0"
description = "pyHB harmonic-balance tools for nonlinear dynamic response analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
examples = [
    "matplotlib",
]
autodiff = [
    "torch",
]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
include = ["pyhb*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
