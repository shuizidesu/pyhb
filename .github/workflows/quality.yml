name: quality

on:
  push:
  pull_request:

jobs:
  static-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Lint
        run: ruff check pyhb examples
      - name: Check formatting
        run: ruff format --check pyhb examples
      - name: Type check
        run: mypy pyhb
      - name: Compile
        run: python -m compileall -q pyhb
      - name: Build distributions
        run: python -m build
      - name: Verify optional Torch boundary
        run: python -c "import sys, pyhb; assert 'torch' not in sys.modules; assert pyhb.__version__"
